[package]
name = "echo-native"
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
echo-avatar-sdk = { path = "avatar-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_StationsAndDesktops", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security"] }

[profile.release]
strip = true
